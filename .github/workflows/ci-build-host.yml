name: Build Host

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: build-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-host:
    name: Build Host
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
